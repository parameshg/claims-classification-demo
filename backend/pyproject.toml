[project]
name = "claims-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["sources"]
testpaths = ["tests"]
