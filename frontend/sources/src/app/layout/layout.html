<a href="#main" class="skip">Skip to content</a>

<header class="bg-bar text-white">
  <div class="mx-auto flex min-h-14 max-w-[1120px] flex-wrap items-center justify-between gap-3 px-6">
    <a routerLink="/" class="flex items-center gap-2 text-[15px] font-semibold tracking-[-0.01em] text-white no-underline">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z" /><path d="M8.5 12l2.5 2.5 4.5-5" /></svg>
      Motor Claims Triage Agent (demo)
    </a>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="nav-link nav-icon"
        [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="theme.toggle()"
      >
        @if (theme.mode() === 'dark') {
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        } @else {
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        }
      </button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<div class="sr-only" role="status" aria-live="polite" aria-atomic="true">{{ announcement() }}</div>
