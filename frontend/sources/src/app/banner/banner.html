<div role="alert" class="flex flex-wrap items-center gap-x-4 gap-y-3 rounded-md border border-danger-line bg-danger-bg px-4 py-3 text-danger-ink">
  <svg aria-hidden="true" class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7.5v5.5M12 16.5v.5" /></svg>
  <p class="m-0 flex-[1_1_320px] text-sm font-medium">{{ message() }}</p>
  @if (retryable()) {
    <button type="button" class="btn btn-danger min-h-9" (click)="retry.emit()">{{ retryLabel() }}</button>
  }
</div>
